name: Vérifier les rotations 2027

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/rotation-engine.test.mjs"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche proposée
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tester les règles de rotation
        run: npm run test:rotations

      - name: Vérifier la compilation TypeScript et Vite
        run: npm run build
