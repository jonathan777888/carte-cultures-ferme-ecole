name: Vérifier les rotations 2027

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "labs/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer la branche proposée
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Tester les règles de rotation
        run: npm run test:advanced

      - name: Compiler et verifier la simulation C11
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic labs/c-systemes/capteur.c -lm -o /tmp/capteur-test
          /tmp/capteur-test

      - name: Vérifier la compilation TypeScript et Vite
        run: npm run build
